x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "20m"
      max-file: "5"

networks:
  public:
    driver: bridge
  internal:
    driver: bridge
    internal: true

volumes:
  postgres_data_prod:
  rabbitmq_data_prod:
  prometheus_data_prod:
  loki_data_prod:
  grafana_data_prod:

services:
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    container_name: orderfirst-postgres-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderfirst_prod}
      POSTGRES_USER: ${POSTGRES_USER:-postgres_prod_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-replace-with-a-strong-postgres-master-password}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_prod_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-replace-with-a-strong-auth-db-password}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_prod_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-replace-with-a-strong-catalog-db-password}
      ORDERS_DB_USER: ${ORDERS_DB_USER:-orders_prod_user}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-replace-with-a-strong-orders-db-password}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_prod_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-replace-with-a-strong-booking-db-password}
    volumes:
      - postgres_data_prod:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d:ro
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres_prod_admin} -d ${POSTGRES_DB:-orderfirst_prod}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    <<: *default-logging
    image: rabbitmq:3-alpine
    container_name: orderfirst-rabbitmq-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-orderfirst_prod_rmq}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-replace-with-a-strong-rabbitmq-password}
    volumes:
      - rabbitmq_data_prod:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  db-migrate:
    <<: *default-logging
    image: node:22-alpine
    container_name: orderfirst-db-migrate-prod
    restart: "no"
    env_file:
      - ../../.env.prod
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderfirst_prod}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_prod_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-replace-with-a-strong-auth-db-password}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_prod_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-replace-with-a-strong-catalog-db-password}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_prod_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-replace-with-a-strong-booking-db-password}
      ORDERS_DB_USER: ${ORDERS_DB_USER:-orders_prod_user}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-replace-with-a-strong-orders-db-password}
    volumes:
      - ../../services:/services:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache openssl
        echo "Deploying production database migrations..."
        DATABASE_URL="postgresql://$${AUTH_DB_USER}:$${AUTH_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=auth" npx --yes prisma@6.19.0 migrate deploy --schema=/services/auth/prisma/schema.prisma
        DATABASE_URL="postgresql://$${CATALOG_DB_USER}:$${CATALOG_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=catalog" npx --yes prisma@6.19.0 migrate deploy --schema=/services/catalog/prisma/schema.prisma
        DATABASE_URL="postgresql://$${BOOKING_DB_USER}:$${BOOKING_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=booking" npx --yes prisma@6.19.0 migrate deploy --schema=/services/booking/prisma/schema.prisma
        DATABASE_URL="postgresql://$${ORDERS_DB_USER}:$${ORDERS_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=orders" npx --yes prisma@6.19.0 migrate deploy --schema=/services/orders/prisma/schema.prisma
        echo "All production migrations applied successfully!"

  auth:
    <<: *default-logging
    image: ${DOCKER_REGISTRY:-orderfirst}/auth:latest
    build:
      context: ../../services/auth
      dockerfile: Dockerfile
    container_name: orderfirst-auth-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      PORT: 4001
      NODE_ENV: production
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_prod_user}:${AUTH_DB_PASSWORD:-replace-with-a-strong-auth-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=auth
      DATABASE_URL_AUTH: postgresql://${AUTH_DB_USER:-auth_prod_user}:${AUTH_DB_PASSWORD:-replace-with-a-strong-auth-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=auth
      JWT_SECRET: ${JWT_SECRET:-generate-a-strong-random-secret-for-production-min-32-chars}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-generate-a-strong-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-https://orderfirst.yourdomain.com}
      RATE_LIMIT_ENABLED: "true"
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-orderfirst_prod_rmq}:${RABBITMQ_DEFAULT_PASS:-replace-with-a-strong-rabbitmq-password}@rabbitmq:5672
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog:
    <<: *default-logging
    image: ${DOCKER_REGISTRY:-orderfirst}/catalog:latest
    build:
      context: ../../services/catalog
      dockerfile: Dockerfile
    container_name: orderfirst-catalog-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      PORT: 4002
      NODE_ENV: production
      DATABASE_URL: postgresql://${CATALOG_DB_USER:-catalog_prod_user}:${CATALOG_DB_PASSWORD:-replace-with-a-strong-catalog-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=catalog
      DATABASE_URL_CATALOG: postgresql://${CATALOG_DB_USER:-catalog_prod_user}:${CATALOG_DB_PASSWORD:-replace-with-a-strong-catalog-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=catalog
      JWT_SECRET: ${JWT_SECRET:-generate-a-strong-random-secret-for-production-min-32-chars}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-generate-a-strong-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-https://orderfirst.yourdomain.com}
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking:
    <<: *default-logging
    image: ${DOCKER_REGISTRY:-orderfirst}/booking:latest
    build:
      context: ../../services/booking
      dockerfile: Dockerfile
    container_name: orderfirst-booking-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      PORT: 4003
      NODE_ENV: production
      DATABASE_URL: postgresql://${BOOKING_DB_USER:-booking_prod_user}:${BOOKING_DB_PASSWORD:-replace-with-a-strong-booking-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=booking
      DATABASE_URL_BOOKING: postgresql://${BOOKING_DB_USER:-booking_prod_user}:${BOOKING_DB_PASSWORD:-replace-with-a-strong-booking-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=booking
      JWT_SECRET: ${JWT_SECRET:-generate-a-strong-random-secret-for-production-min-32-chars}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-generate-a-strong-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-https://orderfirst.yourdomain.com}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-orderfirst_prod_rmq}:${RABBITMQ_DEFAULT_PASS:-replace-with-a-strong-rabbitmq-password}@rabbitmq:5672
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders:
    <<: *default-logging
    image: ${DOCKER_REGISTRY:-orderfirst}/orders:latest
    build:
      context: ../../services/orders
      dockerfile: Dockerfile
    container_name: orderfirst-orders-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      PORT: 4004
      NODE_ENV: production
      DATABASE_URL: postgresql://${ORDERS_DB_USER:-orders_prod_user}:${ORDERS_DB_PASSWORD:-replace-with-a-strong-orders-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=orders
      DATABASE_URL_ORDERS: postgresql://${ORDERS_DB_USER:-orders_prod_user}:${ORDERS_DB_PASSWORD:-replace-with-a-strong-orders-db-password}@postgres:5432/${POSTGRES_DB:-orderfirst_prod}?schema=orders
      CATALOG_SERVICE_URL: http://catalog:4002
      JWT_SECRET: ${JWT_SECRET:-generate-a-strong-random-secret-for-production-min-32-chars}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-generate-a-strong-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-https://orderfirst.yourdomain.com}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-orderfirst_prod_rmq}:${RABBITMQ_DEFAULT_PASS:-replace-with-a-strong-rabbitmq-password}@rabbitmq:5672
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4004/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notify:
    <<: *default-logging
    image: ${DOCKER_REGISTRY:-orderfirst}/notify:latest
    build:
      context: ../../services/notify
      dockerfile: Dockerfile
    container_name: orderfirst-notify-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      PORT: 4005
      NODE_ENV: production
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-orderfirst_prod_rmq}:${RABBITMQ_DEFAULT_PASS:-replace-with-a-strong-rabbitmq-password}@rabbitmq:5672
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
    networks:
      - internal
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4005/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    <<: *default-logging
    image: ${DOCKER_REGISTRY:-orderfirst}/gateway:latest
    build:
      context: ../../services/gateway
      dockerfile: Dockerfile
    container_name: orderfirst-gateway-prod
    restart: always
    env_file:
      - ../../.env.prod
    environment:
      PORT: 4000
      NODE_ENV: production
      JWT_SECRET: ${JWT_SECRET:-generate-a-strong-random-secret-for-production-min-32-chars}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-generate-a-strong-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-https://orderfirst.yourdomain.com}
      RATE_LIMIT_ENABLED: "true"
      AUTH_SERVICE_URL: http://auth:4001
      CATALOG_SERVICE_URL: http://catalog:4002
      BOOKING_SERVICE_URL: http://booking:4003
      ORDERS_SERVICE_URL: http://orders:4004
      NOTIFY_SERVICE_URL: http://notify:4005
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-orderfirst_prod_rmq}:${RABBITMQ_DEFAULT_PASS:-replace-with-a-strong-rabbitmq-password}@rabbitmq:5672
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    networks:
      - public
      - internal
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      booking:
        condition: service_healthy
      orders:
        condition: service_healthy
      notify:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    <<: *default-logging
    image: ${DOCKER_REGISTRY:-orderfirst}/client:latest
    build:
      context: ../../client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: orderfirst-client-prod
    restart: always
    ports:
      - "${CLIENT_PORT:-80}:80"
    networks:
      - public
      - internal
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    <<: *default-logging
    image: prom/prometheus:v2.54.1
    container_name: orderfirst-prometheus-prod
    restart: always
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_prod:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    <<: *default-logging
    image: grafana/loki:3.1.0
    container_name: orderfirst-loki-prod
    restart: always
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data_prod:/loki
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  promtail:
    <<: *default-logging
    image: grafana/promtail:3.1.0
    container_name: orderfirst-promtail-prod
    restart: always
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    <<: *default-logging
    image: grafana/grafana:11.1.0
    container_name: orderfirst-grafana-prod
    restart: always
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-replace-with-a-strong-grafana-password}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data_prod:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - internal
      - public
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
