x-logging: &default-logging
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"

networks:
  public:
    driver: bridge
  internal:
    driver: bridge

volumes:
  postgres_data_local:
  rabbitmq_data_local:
  prometheus_data_local:
  loki_data_local:
  grafana_data_local:

services:
  postgres:
    <<: *default-logging
    image: postgres:16-alpine
    container_name: orderfirst-postgres-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderfirst}
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres_master_password}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password_123}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_password_123}
      ORDERS_DB_USER: ${ORDERS_DB_USER:-orders_user}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_password_123}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_password_123}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data_local:/var/lib/postgresql/data
      - ../../infra/postgres/init:/docker-entrypoint-initdb.d
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres} -d ${POSTGRES_DB:-orderfirst}"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    <<: *default-logging
    image: rabbitmq:3-management-alpine
    container_name: orderfirst-rabbitmq-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_DEFAULT_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_DEFAULT_PASS:-guest}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data_local:/var/lib/rabbitmq
    networks:
      - internal
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 10s
      retries: 10

  db-migrate:
    <<: *default-logging
    image: node:22-alpine
    container_name: orderfirst-db-migrate-local
    restart: "no"
    env_file:
      - ../../.env.local
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-orderfirst}
      AUTH_DB_USER: ${AUTH_DB_USER:-auth_user}
      AUTH_DB_PASSWORD: ${AUTH_DB_PASSWORD:-auth_password_123}
      CATALOG_DB_USER: ${CATALOG_DB_USER:-catalog_user}
      CATALOG_DB_PASSWORD: ${CATALOG_DB_PASSWORD:-catalog_password_123}
      BOOKING_DB_USER: ${BOOKING_DB_USER:-booking_user}
      BOOKING_DB_PASSWORD: ${BOOKING_DB_PASSWORD:-booking_password_123}
      ORDERS_DB_USER: ${ORDERS_DB_USER:-orders_user}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:-orders_password_123}
    volumes:
      - ../../services:/services:ro
    networks:
      - internal
    depends_on:
      postgres:
        condition: service_healthy
    command:
      - /bin/sh
      - -c
      - |
        set -e
        apk add --no-cache openssl
        echo "Deploying local database migrations..."
        DATABASE_URL="postgresql://$${AUTH_DB_USER}:$${AUTH_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=auth" npx --yes prisma@6.19.0 migrate deploy --schema=/services/auth/prisma/schema.prisma
        DATABASE_URL="postgresql://$${CATALOG_DB_USER}:$${CATALOG_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=catalog" npx --yes prisma@6.19.0 migrate deploy --schema=/services/catalog/prisma/schema.prisma
        DATABASE_URL="postgresql://$${BOOKING_DB_USER}:$${BOOKING_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=booking" npx --yes prisma@6.19.0 migrate deploy --schema=/services/booking/prisma/schema.prisma
        DATABASE_URL="postgresql://$${ORDERS_DB_USER}:$${ORDERS_DB_PASSWORD}@postgres:5432/$${POSTGRES_DB}?schema=orders" npx --yes prisma@6.19.0 migrate deploy --schema=/services/orders/prisma/schema.prisma
        echo "All local migrations applied successfully!"

  auth:
    <<: *default-logging
    build:
      context: ../../services/auth
      dockerfile: Dockerfile
    container_name: orderfirst-auth-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      PORT: 4001
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=auth
      DATABASE_URL_AUTH: postgresql://${AUTH_DB_USER:-auth_user}:${AUTH_DB_PASSWORD:-auth_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=auth
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-must-be-32-chars-long}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
    ports:
      - "${AUTH_PORT:-4001}:4001"
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4001/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  catalog:
    <<: *default-logging
    build:
      context: ../../services/catalog
      dockerfile: Dockerfile
    container_name: orderfirst-catalog-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      PORT: 4002
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${CATALOG_DB_USER:-catalog_user}:${CATALOG_DB_PASSWORD:-catalog_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=catalog
      DATABASE_URL_CATALOG: postgresql://${CATALOG_DB_USER:-catalog_user}:${CATALOG_DB_PASSWORD:-catalog_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=catalog
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-must-be-32-chars-long}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
    ports:
      - "${CATALOG_PORT:-4002}:4002"
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4002/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  booking:
    <<: *default-logging
    build:
      context: ../../services/booking
      dockerfile: Dockerfile
    container_name: orderfirst-booking-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      PORT: 4003
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${BOOKING_DB_USER:-booking_user}:${BOOKING_DB_PASSWORD:-booking_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=booking
      DATABASE_URL_BOOKING: postgresql://${BOOKING_DB_USER:-booking_user}:${BOOKING_DB_PASSWORD:-booking_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=booking
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-must-be-32-chars-long}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
    ports:
      - "${BOOKING_PORT:-4003}:4003"
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4003/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  orders:
    <<: *default-logging
    build:
      context: ../../services/orders
      dockerfile: Dockerfile
    container_name: orderfirst-orders-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      PORT: 4004
      NODE_ENV: ${NODE_ENV:-development}
      DATABASE_URL: postgresql://${ORDERS_DB_USER:-orders_user}:${ORDERS_DB_PASSWORD:-orders_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=orders
      DATABASE_URL_ORDERS: postgresql://${ORDERS_DB_USER:-orders_user}:${ORDERS_DB_PASSWORD:-orders_password_123}@postgres:5432/${POSTGRES_DB:-orderfirst}?schema=orders
      CATALOG_SERVICE_URL: http://catalog:4002
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-must-be-32-chars-long}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
    ports:
      - "${ORDERS_PORT:-4004}:4004"
    networks:
      - internal
      - public
    depends_on:
      postgres:
        condition: service_healthy
      db-migrate:
        condition: service_completed_successfully
      catalog:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4004/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  notify:
    <<: *default-logging
    build:
      context: ../../services/notify
      dockerfile: Dockerfile
    container_name: orderfirst-notify-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      PORT: 4005
      NODE_ENV: ${NODE_ENV:-development}
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
      EMAIL_USER: ${EMAIL_USER:-}
      EMAIL_APP_PASSWORD: ${EMAIL_APP_PASSWORD:-}
    ports:
      - "${NOTIFY_PORT:-4005}:4005"
    networks:
      - internal
      - public
    depends_on:
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4005/health/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  gateway:
    <<: *default-logging
    build:
      context: ../../services/gateway
      dockerfile: Dockerfile
    container_name: orderfirst-gateway-local
    restart: unless-stopped
    env_file:
      - ../../.env.local
    environment:
      PORT: 4000
      NODE_ENV: ${NODE_ENV:-development}
      JWT_SECRET: ${JWT_SECRET:-local-jwt-secret-for-development-must-be-32-chars-long}
      INTERNAL_SECRET: ${INTERNAL_SECRET:-local-internal-secret-min-16-chars}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:5173}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-false}
      AUTH_SERVICE_URL: http://auth:4001
      CATALOG_SERVICE_URL: http://catalog:4002
      BOOKING_SERVICE_URL: http://booking:4003
      ORDERS_SERVICE_URL: http://orders:4004
      NOTIFY_SERVICE_URL: http://notify:4005
      RABBITMQ_URL: amqp://${RABBITMQ_DEFAULT_USER:-guest}:${RABBITMQ_DEFAULT_PASS:-guest}@rabbitmq:5672
    ports:
      - "${GATEWAY_PORT:-4000}:4000"
    networks:
      - public
      - internal
    depends_on:
      auth:
        condition: service_healthy
      catalog:
        condition: service_healthy
      booking:
        condition: service_healthy
      orders:
        condition: service_healthy
      notify:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  client:
    <<: *default-logging
    build:
      context: ../../client
      dockerfile: Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-/api}
    container_name: orderfirst-client-local
    restart: unless-stopped
    ports:
      - "${CLIENT_PORT:-5173}:80"
    networks:
      - public
      - internal
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  prometheus:
    <<: *default-logging
    image: prom/prometheus:v2.54.1
    container_name: orderfirst-prometheus-local
    restart: unless-stopped
    volumes:
      - ../monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data_local:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-9090}:9090"
    networks:
      - internal
      - public
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:9090/-/healthy || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  loki:
    <<: *default-logging
    image: grafana/loki:3.1.0
    container_name: orderfirst-loki-local
    restart: unless-stopped
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki/loki-config.yml:/etc/loki/local-config.yaml:ro
      - loki_data_local:/loki
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3100/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

  promtail:
    <<: *default-logging
    image: grafana/promtail:3.1.0
    container_name: orderfirst-promtail-local
    restart: unless-stopped
    command: -config.file=/etc/promtail/config.yml
    volumes:
      - ../monitoring/promtail/promtail-config.yml:/etc/promtail/config.yml:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
    networks:
      - internal
    depends_on:
      - loki

  grafana:
    <<: *default-logging
    image: grafana/grafana:11.1.0
    container_name: orderfirst-grafana-local
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_ADMIN_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data_local:/var/lib/grafana
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    networks:
      - internal
      - public
    depends_on:
      - prometheus
      - loki
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3

